packages:
  - apps/*
  - packages/*

nodeVersion: 24.18.0
engineStrict: true
verifyDepsBeforeRun: error
enableGlobalVirtualStore: false

autoInstallPeers: false
strictPeerDependencies: true
savePrefix: ""

minimumReleaseAge: 1440
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
trustLockfile: false
blockExoticSubdeps: true

strictDepBuilds: true
allowBuilds: {}

overrides:
  "@eslint/config-array@0.21.2>minimatch": "10.2.5"
  "@eslint/eslintrc@3.3.6>minimatch": "10.2.5"
  "@fastify/ajv-compiler@4.0.5>fast-uri": "3.1.4"
  ajv@8.20.0>fast-uri: "3.1.4"
  eslint@9.39.5>minimatch: "10.2.5"
  fast-json-stringify@7.0.1>fast-uri: "4.1.1"
  fastify@5.10.0>find-my-way: "9.7.0"
  markdownlint-cli2@0.23.1>js-yaml: "5.2.2"
  minimatch@10.2.5>brace-expansion: "5.0.8"
  next@16.2.11>postcss: "8.5.19"
  next@16.2.11>sharp: "-"
