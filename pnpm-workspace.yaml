packages:
  - apps/*
  - packages/*

nodeVersion: 24.20.0
engineStrict: true
autoInstallPeers: false
strictPeerDependencies: true
savePrefix: ""
injectWorkspacePackages: true
minimumReleaseAge: 1440
# Exact immutable release fixtures used by the 0.4.3 -> 0.5.0 upgrade regressions.
minimumReleaseAgeExclude:
  - "@viberacing/connector"
strictDepBuilds: true
allowBuilds: {}

overrides:
  nanoid@<3.3.18: 3.3.18
  next@16.3.4>baseline-browser-mapping: "2.11.0"
  next@16.3.4>sharp: "-"
