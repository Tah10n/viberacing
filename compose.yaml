services:
  db:
    image: postgres:17.6-bookworm@sha256:feff5b24fedd610975a1f5e743c51a4b360437f4dc3a11acf740dcd708f413f6
    environment:
      POSTGRES_DB: viberacing
      POSTGRES_PASSWORD: viberacing
      POSTGRES_USER: viberacing
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viberacing -d viberacing"]
      interval: 2s
      timeout: 2s
      retries: 30
    ports:
      - "127.0.0.1:${VIBERACING_LOCAL_DATABASE_PORT:-55432}:5432"
    volumes:
      - viberacing-local-data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://viberacing:viberacing@db:5432/viberacing
      VIBERACING_DATABASE_SSL: "false"
      VIBERACING_ALLOW_INSECURE_LOCAL: "true"
    env_file:
      - apps/web/.env.local
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "node scripts/migrate.mjs && exec node server.js"]
    ports:
      - "127.0.0.1:${VIBERACING_LOCAL_WEB_PORT:-3000}:3000"

volumes:
  viberacing-local-data:
    name: ${VIBERACING_LOCAL_VOLUME_NAME:-viberacing-local-data}
