name: Connector release candidates

on:
  workflow_dispatch:

permissions:
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: connector-release-candidate
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  candidate:
    name: Build ${{ matrix.target }} unsigned candidate
    if: github.ref == 'refs/heads/main'
    environment: connector-release-candidate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - target: windows-x86_64
            runner: windows-2025
            executable: viberacing-connector.exe
          - target: macos-aarch64
            runner: macos-15
            executable: viberacing-connector
          - target: macos-x86_64
            runner: macos-15-intel
            executable: viberacing-connector
          - target: linux-x86_64
            runner: ubuntu-24.04
            executable: viberacing-connector
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            executable: viberacing-connector
    env:
      VIBERACING_CONNECTOR_RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out main without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Scan public files before the native build
        run: node scripts/check-public-files.mjs --all

      - name: Install the Linux Secret Service build dependency
        if: startsWith(matrix.target, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libdbus-1-dev pkg-config

      - name: Install the pinned minimal Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal

      - name: Build the exact locked release profile
        run:
          cargo build --release --locked --target-dir target --package viberacing-connector --bin
          viberacing-connector

      - name: Exercise bounded install and uninstall
        run: node scripts/test-connector-windows-portable.mjs

      - name: Prepare checksums, compatibility declaration, and SPDX SBOM
        run: node scripts/connector-release-candidate.mjs

      - name: Sign build provenance with GitHub Sigstore
        id: provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path:
            target/connector-release-candidate/${{ matrix.target }}/${{ matrix.executable }}

      - name: Sign the SPDX SBOM attestation with GitHub Sigstore
        id: sbom
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          sbom-path: target/connector-release-candidate/${{ matrix.target }}/sbom.spdx.json
          subject-path:
            target/connector-release-candidate/${{ matrix.target }}/${{ matrix.executable }}

      - name: Upload only the explicitly unsigned candidate bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: UNSIGNED-CANDIDATE-${{ matrix.target }}
          path: target/connector-release-candidate/${{ matrix.target }}
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          overwrite: false
          retention-days: 7
