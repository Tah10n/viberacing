name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  node:
    name: Node and repository gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.7.0

      - name: Scan public files before dependency installation
        run: node scripts/check-public-files.mjs --all

      - name: Install pinned Rust for Cargo license metadata
        run: rustup toolchain install 1.94.0 --profile minimal

      - name: Fetch the exact locked Cargo graph without building it
        run: cargo fetch --locked

      - name: Install locked dependencies without lifecycle scripts
        run: >-
          pnpm install --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org/

      - name: Run deterministic Node and repository gates
        run: pnpm run verify:node

      - name: Exercise the local Ingest HTTP-to-PostgreSQL path
        run: pnpm run test:ingest:postgres-integration

      - name: Exercise the local Jobs CLI-to-PostgreSQL path
        run: pnpm run test:jobs:postgres-integration

      - name: Exercise the fixed-clock Jobs scheduler-to-PostgreSQL path
        run: pnpm run test:jobs-scheduler:postgres-integration

      - name: Audit the locked dependency graph
        run: pnpm audit --audit-level high --registry=https://registry.npmjs.org/

  rust:
    name: Rust workspace gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: >-
          rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt

      - name: Validate the Rust workspace
        run: node scripts/check-rust.mjs

  connector_windows_portable:
    name: Windows portable connector lifecycle
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Scan public files before the native build
        run: node scripts/check-public-files.mjs --all

      - name: Install the pinned minimal Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal

      - name: Build the locked release-profile connector
        run:
          cargo build --release --locked --target-dir target --package viberacing-connector --bin
          viberacing-connector

      - name: Exercise bounded portable copy and removal
        run: node scripts/test-connector-windows-portable.mjs

  database:
    name: PostgreSQL capability and invariant gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Exercise isolated PostgreSQL roles and constraints
        run: node scripts/test-database-integration.mjs
