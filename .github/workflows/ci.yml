name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  connector:
    name: Connector (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-2025' && 60 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: corepack install --global pnpm@11.7.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify Cursor multi-account sync on Windows
        if: runner.os == 'Windows'
        run: pnpm --filter @viberacing/connector exec node --test test/cursor-sync.test.mjs
      - name: Run connector tests
        if: runner.os != 'Windows'
        run: pnpm --filter @viberacing/connector test
      - name: Run connector tests sequentially on Windows
        if: runner.os == 'Windows'
        run: pnpm --filter @viberacing/connector exec node --test --test-concurrency=1
      - name: Verify Cursor evidence probe on the host OS
        run: node --test scripts/cursor-evidence-probe.test.mjs
      - name: Install the OpenCode-compatible Bun runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Verify the pinned OpenCode compatibility target
        env:
          npm_config_cache: ${{ runner.temp }}/opencode-npm-cache
        run: >-
          npm exec --yes --allow-scripts=opencode-ai --package opencode-ai@1.18.23 -- opencode
          --version
      - name: Smoke the generated OpenCode plugin with a real detached launcher
        env:
          VIBERACING_TEST_OPENCODE_VERSION: 1.18.23
        run: node scripts/test-opencode-plugin-smoke.mjs
      - name: Verify the real macOS custom URL handler
        if: runner.os == 'macOS'
        env:
          VIBERACING_TEST_MAC_URL_HANDLER: "1"
        run: >-
          pnpm --filter @viberacing/connector exec node --test
          test/browser-integration.macos.test.mjs

  local-smoke:
    name: Documented local startup
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VIBERACING_LOCAL_DATABASE_PORT: 55433
      VIBERACING_LOCAL_VOLUME_NAME: viberacing-ci-local-data
      VIBERACING_LOCAL_WEB_PORT: 3011
      VIBERACING_TEST_ORIGIN: http://127.0.0.1:3011
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: corepack install --global pnpm@11.7.0
      - name: Create synthetic local configuration
        run: |
          printf '%s\n' \
            'DATABASE_URL=postgresql://viberacing:viberacing@localhost:55433/viberacing' \
            'VIBERACING_PUBLIC_ORIGIN=http://localhost:3011' \
            'VIBERACING_ALLOW_INSECURE_LOCAL=true' \
            'GITHUB_CLIENT_ID=synthetic-local-client' \
            'GITHUB_CLIENT_SECRET=synthetic-local-secret' \
            'VIBERACING_DATABASE_SSL=false' \
            'VIBERACING_MIN_CONNECTOR_VERSION=0.2.0' \
            'VIBERACING_MAX_DAILY_TOKENS=9999999999999999' > apps/web/.env.local
      - name: Start the documented Compose stack
        run: corepack pnpm local:up
      - name: Verify direct local mode and connector scenarios
        run: |
          test "$(docker compose exec -T web printenv VIBERACING_TRUST_PROXY)" = "none"
          curl --fail --silent http://127.0.0.1:3011/ready
          pnpm install --frozen-lockfile --ignore-scripts
          corepack pnpm local:test
      - name: Stop the local stack
        if: always()
        run: corepack pnpm local:down

  browser-e2e:
    name: Browser E2E and accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
        env:
          POSTGRES_DB: viberacing
          POSTGRES_PASSWORD: viberacing
          POSTGRES_USER: viberacing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U viberacing -d viberacing" --health-interval 2s
          --health-timeout 2s --health-retries 20
    env:
      DATABASE_URL: postgresql://viberacing:viberacing@127.0.0.1:5432/viberacing
      VIBERACING_DATABASE_SSL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: corepack install --global pnpm@11.7.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @viberacing/web exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm --filter @viberacing/web test:e2e

  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
        env:
          POSTGRES_DB: viberacing
          POSTGRES_PASSWORD: viberacing
          POSTGRES_USER: viberacing
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U viberacing -d viberacing" --health-interval 2s
          --health-timeout 2s --health-retries 20
    env:
      DATABASE_URL: postgresql://viberacing:viberacing@127.0.0.1:55432/viberacing
      VIBERACING_PUBLIC_ORIGIN: http://localhost:3000
      VIBERACING_DATABASE_SSL: "false"
      VIBERACING_ALLOW_INSECURE_LOCAL: "true"
      VIBERACING_TRUST_PROXY: "trusted-x-real-ip"
      VIBERACING_TEST_TRUSTED_PROXY: "true"
      VIBERACING_MIN_CONNECTOR_VERSION: 0.2.0
      VIBERACING_MAX_DAILY_TOKENS: "9999999999999999"
      GITHUB_CLIENT_ID: synthetic-ci-client
      GITHUB_CLIENT_SECRET: synthetic-ci-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: corepack install --global pnpm@11.7.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Enforce append-only and monotonic published migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-migration-history.mjs "$BASE_SHA" HEAD
      - name: Require a new version for changed connector archive contents
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-connector-version-bump.mjs "$BASE_SHA" HEAD
      - name: Verify source, unit tests, and production build
        run: pnpm verify
      - name: Migrate an empty database twice
        run: |
          pnpm db:migrate
          pnpm db:migrate
          expected_migrations="$(find apps/web/database -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          applied_migrations="$(psql "$DATABASE_URL" --tuples-only --no-align --command='SELECT count(*) FROM schema_migrations')"
          test "$applied_migrations" = "$expected_migrations"
      - name: Reject a modified applied migration checksum
        run: |
          expected_checksum="$(node -e "process.stdout.write(require('./apps/web/database/checksums.json')['001_initial.sql'])")"
          psql "$DATABASE_URL" --command="UPDATE schema_migrations SET checksum = repeat('f', 64) WHERE version = '001_initial.sql'"
          if pnpm db:migrate; then
            echo "Migration runner accepted a modified applied checksum" >&2
            exit 1
          fi
          psql "$DATABASE_URL" --command="UPDATE schema_migrations SET checksum = '$expected_checksum' WHERE version = '001_initial.sql'"
          pnpm db:migrate
      - name: Reject the unsupported pre-baseline ledger and tolerate future rollback rows
        run: |
          psql "$DATABASE_URL" --command="UPDATE schema_migrations SET checksum = repeat('0', 64) WHERE version = '001_initial.sql'"
          if pnpm db:migrate; then
            echo "Migration runner accepted an unsupported pre-baseline checksum" >&2
            exit 1
          fi
          expected_checksum="$(node -e "process.stdout.write(require('./apps/web/database/checksums.json')['001_initial.sql'])")"
          psql "$DATABASE_URL" --command="UPDATE schema_migrations SET checksum = '$expected_checksum' WHERE version = '001_initial.sql'"
          latest_migration="$(psql "$DATABASE_URL" --tuples-only --no-align --command='SELECT max(version) FROM schema_migrations')"
          latest_number="${latest_migration%%_*}"
          future_migration="$(printf '%03d_synthetic_future.sql' "$((10#$latest_number + 1))")"
          psql "$DATABASE_URL" --command="INSERT INTO schema_migrations (version, checksum) VALUES ('$future_migration', repeat('f', 64))"
          pnpm db:migrate
          psql "$DATABASE_URL" --command="DELETE FROM schema_migrations WHERE version = '$future_migration'"
      - name: Run server integration scenarios
        run: |
          node apps/web/.next/standalone/apps/web/server.js &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:3000/ready >/dev/null && break
            sleep 1
          done
          node scripts/test-local-scenarios.mjs
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level moderate
      - name: Verify connector package contents
        run: pnpm connector:package:check
      - name: Regression - build production image from the release context
        run: docker build --tag viberacing:ci .
      - name: Verify production failure diagnostics are safe
        run: |
          invalid_log="$RUNNER_TEMP/viberacing-invalid-startup.log"
          if docker run --rm --network host \
            --env DATABASE_URL="$DATABASE_URL" \
            --env VIBERACING_PUBLIC_ORIGIN=http://localhost:3012 \
            --env VIBERACING_ALLOW_INSECURE_LOCAL=true \
            --env VIBERACING_DATABASE_SSL=false \
            --env VIBERACING_MIN_CONNECTOR_VERSION=0.2.0 \
            --env VIBERACING_MAX_DAILY_TOKENS=9999999999999999 \
            --env GITHUB_CLIENT_ID=synthetic-ci-client \
            --env PORT=3012 viberacing:ci >"$invalid_log" 2>&1; then
            invalid_status=0
          else
            invalid_status=$?
          fi
          test "$invalid_status" -eq 1
          configuration_records="$(grep -c '"event":"server_configuration_invalid"' "$invalid_log" || true)"
          test "$configuration_records" -eq 1
          grep --fixed-strings '"errorCode":"CONFIG_GITHUB_CLIENT_SECRET_MISSING"' "$invalid_log" >/dev/null
          if grep --extended-regexp '"message"|"stack"|Missing required|Error:|/app/|server\.js:' "$invalid_log" >/dev/null; then
            echo "Unsafe detail was present in the invalid-startup diagnostic"
            exit 1
          fi

          invalid_tls_log="$RUNNER_TEMP/viberacing-invalid-database-tls.log"
          if docker run --rm --network host \
            --env DATABASE_URL="$DATABASE_URL" \
            --env VIBERACING_PUBLIC_ORIGIN=http://localhost:3012 \
            --env VIBERACING_ALLOW_INSECURE_LOCAL=true \
            --env VIBERACING_DATABASE_SSL=tru \
            --env VIBERACING_MIN_CONNECTOR_VERSION=0.2.0 \
            --env VIBERACING_MAX_DAILY_TOKENS=9999999999999999 \
            --env GITHUB_CLIENT_ID=synthetic-ci-client \
            --env GITHUB_CLIENT_SECRET=synthetic-ci-secret \
            --env PORT=3012 viberacing:ci >"$invalid_tls_log" 2>&1; then
            invalid_tls_status=0
          else
            invalid_tls_status=$?
          fi
          test "$invalid_tls_status" -eq 1
          test "$(grep -c '"event":"server_configuration_invalid"' "$invalid_tls_log" || true)" -eq 1
          grep --fixed-strings '"errorCode":"CONFIG_DATABASE_SSL_INVALID"' "$invalid_tls_log" >/dev/null
          if grep --extended-regexp '"message"|"stack"|Error:|/app/|server\.js:' "$invalid_tls_log" >/dev/null; then
            echo "Unsafe detail was present in the invalid-TLS startup diagnostic"
            exit 1
          fi

          conflicting_tls_log="$RUNNER_TEMP/viberacing-conflicting-database-tls.log"
          if docker run --rm --network host \
            --env DATABASE_URL="${DATABASE_URL}?sslmode=disable" \
            --env VIBERACING_PUBLIC_ORIGIN=http://localhost:3012 \
            --env VIBERACING_ALLOW_INSECURE_LOCAL=true \
            --env VIBERACING_DATABASE_SSL=true \
            --env VIBERACING_MIN_CONNECTOR_VERSION=0.2.0 \
            --env VIBERACING_MAX_DAILY_TOKENS=9999999999999999 \
            --env GITHUB_CLIENT_ID=synthetic-ci-client \
            --env GITHUB_CLIENT_SECRET=synthetic-ci-secret \
            --env PORT=3012 viberacing:ci >"$conflicting_tls_log" 2>&1; then
            conflicting_tls_status=0
          else
            conflicting_tls_status=$?
          fi
          test "$conflicting_tls_status" -eq 1
          test "$(grep -c '"event":"server_configuration_invalid"' "$conflicting_tls_log" || true)" -eq 1
          grep --fixed-strings '"errorCode":"CONFIG_DATABASE_URL_SSL_CONFLICT"' "$conflicting_tls_log" >/dev/null
          if grep --extended-regexp '"message"|"stack"|sslmode|Error:|/app/|server\.js:' "$conflicting_tls_log" >/dev/null; then
            echo "Unsafe detail was present in the conflicting-TLS startup diagnostic"
            exit 1
          fi

          invalid_migration_tls_log="$RUNNER_TEMP/viberacing-invalid-migration-database-tls.log"
          if docker run --rm --network host \
            --env DATABASE_URL="$DATABASE_URL" \
            --env VIBERACING_DATABASE_SSL=tru \
            --entrypoint node viberacing:ci scripts/migrate.mjs >"$invalid_migration_tls_log" 2>&1; then
            invalid_migration_tls_status=0
          else
            invalid_migration_tls_status=$?
          fi
          test "$invalid_migration_tls_status" -eq 1
          test "$(grep -c '"event":"migration_configuration_failed"' "$invalid_migration_tls_log" || true)" -eq 1
          grep --fixed-strings '"errorCode":"CONFIG_DATABASE_SSL_INVALID"' "$invalid_migration_tls_log" >/dev/null
          if grep --extended-regexp '"message"|"stack"|Error:|/app/|migrate\.mjs:' "$invalid_migration_tls_log" >/dev/null; then
            echo "Unsafe detail was present in the invalid-TLS migration diagnostic"
            exit 1
          fi

          conflicting_migration_tls_log="$RUNNER_TEMP/viberacing-conflicting-migration-database-tls.log"
          if docker run --rm --network host \
            --env DATABASE_URL="${DATABASE_URL}?sslmode=no-verify" \
            --env VIBERACING_DATABASE_SSL=true \
            --entrypoint node viberacing:ci scripts/migrate.mjs >"$conflicting_migration_tls_log" 2>&1; then
            conflicting_migration_tls_status=0
          else
            conflicting_migration_tls_status=$?
          fi
          test "$conflicting_migration_tls_status" -eq 1
          test "$(grep -c '"event":"migration_configuration_failed"' "$conflicting_migration_tls_log" || true)" -eq 1
          grep --fixed-strings '"errorCode":"CONFIG_DATABASE_URL_SSL_CONFLICT"' "$conflicting_migration_tls_log" >/dev/null
          if grep --extended-regexp '"message"|"stack"|sslmode|Error:|/app/|migrate\.mjs:' "$conflicting_migration_tls_log" >/dev/null; then
            echo "Unsafe detail was present in the conflicting-TLS migration diagnostic"
            exit 1
          fi

          database_log="$RUNNER_TEMP/viberacing-database-unavailable.log"
          docker run --detach --name viberacing-ci-database-unavailable --network host \
            --env DATABASE_URL=postgresql://private-user:private-password@127.0.0.1:1/private-database \
            --env VIBERACING_PUBLIC_ORIGIN=http://localhost:3012 \
            --env VIBERACING_ALLOW_INSECURE_LOCAL=true \
            --env VIBERACING_DATABASE_SSL=false \
            --env VIBERACING_MIN_CONNECTOR_VERSION=0.2.0 \
            --env VIBERACING_MAX_DAILY_TOKENS=9999999999999999 \
            --env GITHUB_CLIENT_ID=synthetic-ci-client \
            --env GITHUB_CLIENT_SECRET=private-client-secret \
            --env PORT=3012 viberacing:ci
          trap 'docker rm --force viberacing-ci-database-unavailable >/dev/null 2>&1 || true' EXIT
          database_container_ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3012/health >/dev/null; then
              database_container_ready=true
              break
            fi
            sleep 1
          done
          test "$database_container_ready" = true
          response_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3012/)"
          test "$response_status" = 500
          docker logs viberacing-ci-database-unavailable >"$database_log" 2>&1
          grep --fixed-strings '"event":"next_request_error"' "$database_log" >/dev/null
          grep --fixed-strings '"diagnosticCode":"CONNECTION_REFUSED"' "$database_log" >/dev/null
          grep --fixed-strings '"errorCode":"ECONNREFUSED"' "$database_log" >/dev/null
          if grep --extended-regexp 'private-user|private-password|private-database|private-client-secret|127\.0\.0\.1:1|"message"|"stack"|/app/' "$database_log" >/dev/null; then
            echo "Unsafe detail was present in the database-unavailable diagnostic"
            exit 1
          fi
      - name: Verify production container and readiness
        run: |
          test "$(docker image inspect viberacing:ci --format '{{.Config.User}}')" = "node"
          docker run --detach --name viberacing-ci --network host \
            --env DATABASE_URL="$DATABASE_URL" \
            --env VIBERACING_PUBLIC_ORIGIN=http://localhost:3010 \
            --env VIBERACING_ALLOW_INSECURE_LOCAL=true \
            --env VIBERACING_DATABASE_SSL=false \
            --env VIBERACING_MIN_CONNECTOR_VERSION=0.2.0 \
            --env VIBERACING_MAX_DAILY_TOKENS=9999999999999999 \
            --env GITHUB_CLIENT_ID=synthetic-ci-client \
            --env GITHUB_CLIENT_SECRET=synthetic-ci-secret \
            --env PORT=3010 viberacing:ci
          trap 'docker rm --force viberacing-ci >/dev/null 2>&1 || true' EXIT
          viberacing_ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3010/ready >/dev/null; then
              viberacing_ready=true
              break
            fi
            sleep 1
          done
          if [ "$viberacing_ready" != true ]; then
            docker logs viberacing-ci
            exit 1
          fi
          curl --fail --silent --show-error \
            --output "$RUNNER_TEMP/viberacing-connector.tgz" \
            http://127.0.0.1:3010/downloads/viberacing-connector.tgz
          npm exec --yes --cache "$RUNNER_TEMP/viberacing-npm-cache" \
            --package http://127.0.0.1:3010/downloads/viberacing-connector.tgz \
            -- viberacing --help

  ci-required:
    name: ci-required
    if: always()
    needs: [connector, local-smoke, browser-e2e, production]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every mandatory CI job
        env:
          CONNECTOR_RESULT: ${{ needs.connector.result }}
          LOCAL_SMOKE_RESULT: ${{ needs['local-smoke'].result }}
          BROWSER_E2E_RESULT: ${{ needs['browser-e2e'].result }}
          PRODUCTION_RESULT: ${{ needs.production.result }}
        run: |
          test "$CONNECTOR_RESULT" = success
          test "$LOCAL_SMOKE_RESULT" = success
          test "$BROWSER_E2E_RESULT" = success
          test "$PRODUCTION_RESULT" = success
