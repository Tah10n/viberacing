name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-bookworm@sha256:feff5b24fedd610975a1f5e743c51a4b360437f4dc3a11acf740dcd708f413f6
        env:
          POSTGRES_DB: viberacing
          POSTGRES_PASSWORD: viberacing
          POSTGRES_USER: viberacing
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U viberacing -d viberacing" --health-interval 2s
          --health-timeout 2s --health-retries 20
    steps:
      - name: Check out
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.7.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify
        run: pnpm verify

      - name: Build production image
        run: docker build --tag viberacing:ci .

      - name: Run production migration
        run: >-
          docker run --rm --network host --env
          DATABASE_URL=postgresql://viberacing:viberacing@127.0.0.1:55432/viberacing --env
          VIBERACING_DATABASE_SSL=false viberacing:ci node scripts/migrate.mjs
