name: Publish connector

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-connector
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.release.draft == false && github.event.release.prerelease == false
    environment: npm-production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: corepack enable
      - run: corepack install --global pnpm@11.7.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate release metadata, tools, and npm availability
        run: node scripts/check-connector-release.mjs "$RELEASE_TAG"
      - name: Require the tagged commit to be part of origin/main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Generate and verify the connector package
        run: |
          corepack pnpm --filter @viberacing/connector prepack
          git diff --exit-code
          corepack pnpm verify
          corepack pnpm connector:package:check
      - name: Inspect the npm package candidate
        working-directory: packages/connector
        run: npm pack --dry-run
      - name: Recheck the clean, unpublished, newer candidate
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
          node scripts/check-connector-release.mjs "$RELEASE_TAG"
      - name: Publish the stable connector with npm Trusted Publishing
        working-directory: packages/connector
        run: npm publish --access public --tag latest
      - name: Verify the published version and latest tag
        run: node scripts/check-connector-release.mjs --verify-published "$RELEASE_TAG"
