name: Publish connector

on:
  workflow_run:
    workflows: [Connector release request]
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-connector
  cancel-in-progress: false

jobs:
  publish:
    if:
      github.ref == 'refs/heads/main' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'release' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    environment: npm-production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require the tagged commit to be part of origin/main
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: Require the triggering stable release to match HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$RELEASE_SHA" = "$(git rev-parse HEAD)"
          test "$RELEASE_SHA" = "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          published_tag="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
              --jq 'select(.draft == false and .prerelease == false) | .tag_name'
          )"
          test "$published_tag" = "$RELEASE_TAG"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: corepack enable
      - run: corepack install --global pnpm@11.7.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate release metadata, tools, and npm availability
        run: node scripts/check-connector-release.mjs "$RELEASE_TAG"
      - name: Generate and verify the connector package
        run: |
          corepack pnpm --filter @viberacing/connector prepack
          git diff --exit-code
          corepack pnpm verify
          corepack pnpm connector:package:check
      - name: Inspect the npm package candidate
        working-directory: packages/connector
        run: npm pack --dry-run
      - name: Recheck the clean, unpublished, newer candidate
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
          node scripts/check-connector-release.mjs "$RELEASE_TAG"
      - name: Publish the stable connector with npm Trusted Publishing
        working-directory: packages/connector
        run: npm publish --access public --tag latest
      - name: Verify the published version and latest tag
        run: node scripts/check-connector-release.mjs --verify-published "$RELEASE_TAG"
